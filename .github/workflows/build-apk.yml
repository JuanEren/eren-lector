name: Compilar candidata GB02 R04 R18 correcciones
run-name: GB02 R04 · R18 correcciones · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - codex/gb02-r16-visual-integration-20260827
    paths:
      - .github/workflows/build-apk.yml
      - Eren-GitHub-Actualizacion-R18.zip
      - Eren-GitHub-Actualizacion-R18.zip.sha256
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_candidate_r18:
    name: Aplicar R11 + R14 + R15 + R16 + R17 + R18, validar y compilar
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_SPEECH_VOICE: es-ES-ElviraNeural
      EXPECTED_BRANCH: codex/gb02-r16-visual-integration-20260827
      BASE_ARCHIVE: Eren-Leo-y-entiendo-Android.zip
      BASE_SHA256: 155ba166ebc9e4e1d4b5f2d7f1aba3ca2fa511d4e9211cb38489d7c0242f60e9
      BASELINE_MAIN_SHA: cf94cb32c2923a2810e1516ac93e75528ff9b320
      R14_SHA256: 12c774e8713f76257a9f3e0e062d5998ba54151d17ae7cee0c3e749d0f1e3d1d
      R15_SHA256: 2aec41d7e8c4198759519216070876bab438d1d33e3c73e0733d5261e393c13f
      R16_SHA256: cc0606cab0e3d472531005757a1ba289b9dbeadb02563802fe3632c02cbada35
      R17_SHA256: 0de78652ced4c3cb3b0acafa4e86fc76d483fe1b196bb5bb3c0713648579db94
      R18_SHA256: 7ee4afab0d2036b258a81f9104a47f778c146bfc27398e3ef3fdb307f61e11e6
      CONTRACT_SHA256: 02692ced658695b7e5ce95d9b1709448835b16427812e8393c61bc67466e6055
      S012_R17_SHA256: cdf8ef053ace7551c74c77ab3ea7ff63f156df7466d76fa0a4bf0813f9024f30

    steps:
      - name: Descargar el ramal seleccionado
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar ramal aislado y alcance autorizado
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_BRANCH" ]]; then
            echo "::error::Ejecuta este workflow desde $EXPECTED_BRANCH, no desde $GITHUB_REF_NAME."
            exit 1
          fi
          git merge-base --is-ancestor "$BASELINE_MAIN_SHA" HEAD
          mapfile -t changed_files < <(git diff --name-only "$BASELINE_MAIN_SHA"...HEAD)
          if (( ${#changed_files[@]} == 0 )); then
            echo "::error::El ramal candidato no contiene cambios."
            exit 1
          fi
          for path in "${changed_files[@]}"; do
            case "$path" in
              .github/workflows/build-apk.yml|\
              Eren-GitHub-Actualizacion-R14.zip|Eren-GitHub-Actualizacion-R14.zip.sha256|\
              Eren-GitHub-Actualizacion-R15.zip|Eren-GitHub-Actualizacion-R15.zip.sha256|\
              Eren-GitHub-Actualizacion-R16.zip|Eren-GitHub-Actualizacion-R16.zip.sha256|\
              Eren-GitHub-Actualizacion-R17.zip|Eren-GitHub-Actualizacion-R17.zip.sha256|\
              Eren-GitHub-Actualizacion-R18.zip|Eren-GitHub-Actualizacion-R18.zip.sha256)
                ;;
              *)
                echo "::error::Cambio fuera del alcance R18: $path"
                exit 1
                ;;
            esac
          done
          printf 'Cambios autorizados R18:\n'
          printf ' - %s\n' "${changed_files[@]}"

      - name: Verificar archivos y reconstruir R11 + R14 + R15 + R16 + R17 + R18
        shell: bash
        run: |
          set -euo pipefail

          base_path="$GITHUB_WORKSPACE/$BASE_ARCHIVE"
          echo "$BASE_SHA256  $base_path" | sha256sum -c -
          required_updates=(
            'Eren-GitHub-Actualizacion-R05.zip|54793872d6cbfd1d5538e9786fa8b2b4f14110d45bea753e7b8a90456dd79daa'
            'Eren-GitHub-Actualizacion-R07.zip|06232bc6a71698edc4d5b4fb3dcd01d7c35a8f6e5cb51b11e5207c5b90a90b58'
            'Eren-GitHub-Actualizacion-R08.zip|545cc13c81811324e1475b7042b9dc92ffd42c6f8fdb9285f78838b743e46491'
            'Eren-GitHub-Actualizacion-R09.zip|29c8c8fa4c7bfecfeec10c454ed04a8544a764ca0317a9f4cdc0be385446d86e'
            'Eren-GitHub-Actualizacion-R10.zip|500a196c3e51c1ed014b5314d9459847c0cc1a3615e4195ef8a3cd7023a87e60'
            'Eren-GitHub-Actualizacion-R11.zip|de850e6591ea2ca2630e3386d003bb383b00820b9ee57f2625f8222ce1fd9843'
            "Eren-GitHub-Actualizacion-R14.zip|$R14_SHA256"
            "Eren-GitHub-Actualizacion-R15.zip|$R15_SHA256"
            "Eren-GitHub-Actualizacion-R16.zip|$R16_SHA256"
            "Eren-GitHub-Actualizacion-R17.zip|$R17_SHA256"
            "Eren-GitHub-Actualizacion-R18.zip|$R18_SHA256"
          )
          preserved_updates=(
            'Eren-GitHub-Actualizacion-R12.zip|5069a166150cb3b2d3a756fb9ae0dc91fe711187e038ed9ad46657e4cb39ee2a'
            'Eren-GitHub-Actualizacion-R13.zip|c5f260793431c3cf785d18542a2d864c6c02ca54547fea52128108c99b6146e4'
          )
          for spec in "${required_updates[@]}" "${preserved_updates[@]}"; do
            IFS='|' read -r archive expected_sha <<< "$spec"
            archive_path="$GITHUB_WORKSPACE/$archive"
            if [[ ! -f "$archive_path" ]]; then
              echo "::error::Falta $archive."
              exit 1
            fi
            echo "$expected_sha  $archive_path" | sha256sum -c -
          done
          grep -Fxq "$R14_SHA256  Eren-GitHub-Actualizacion-R14.zip" Eren-GitHub-Actualizacion-R14.zip.sha256
          grep -Fxq "$R15_SHA256  Eren-GitHub-Actualizacion-R15.zip" Eren-GitHub-Actualizacion-R15.zip.sha256
          grep -Fxq "$R16_SHA256  Eren-GitHub-Actualizacion-R16.zip" Eren-GitHub-Actualizacion-R16.zip.sha256
          grep -Fxq "$R17_SHA256  Eren-GitHub-Actualizacion-R17.zip" Eren-GitHub-Actualizacion-R17.zip.sha256
          grep -Fxq "$R18_SHA256  Eren-GitHub-Actualizacion-R18.zip" Eren-GitHub-Actualizacion-R18.zip.sha256
          echo 'R12 y R13 verificados: preservados y fuera de la cadena de aplicación.'

          source_root=$(mktemp -d "$RUNNER_TEMP/eren-r18.XXXXXX")
          unzip -q "$base_path" -d "$source_root"
          project_dir="$source_root/eren-android"
          test -d "$project_dir"

          for spec in "${required_updates[@]}"; do
            IFS='|' read -r archive expected_sha <<< "$spec"
            archive_path="$GITHUB_WORKSPACE/$archive"
            revision="${archive#Eren-GitHub-Actualizacion-}"
            revision="${revision%.zip}"
            archive_size=$(stat -c '%s' "$archive_path")
            if (( archive_size > 20971520 )); then
              echo "::error::$archive supera 20 MB."
              exit 1
            fi
            if unzip -Z1 "$archive_path" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "::error::$archive contiene una ruta no segura."
              exit 1
            fi
            mapfile -t delete_entries < <(unzip -Z1 "$archive_path" | grep -E '^docs/updates/R[0-9]+/DELETE_FILES\.txt$' || true)
            mapfile -t checksum_entries < <(unzip -Z1 "$archive_path" | grep -E '^docs/updates/R[0-9]+/SHA256SUMS_UPDATE_R[0-9]+\.txt$' || true)
            expected_delete="docs/updates/$revision/DELETE_FILES.txt"
            expected_checksums="docs/updates/$revision/SHA256SUMS_UPDATE_$revision.txt"
            if (( ${#delete_entries[@]} != 1 || ${#checksum_entries[@]} != 1 )); then
              echo "::error::$archive debe contener un único par de manifiestos."
              exit 1
            fi
            [[ "${delete_entries[0]}" == "$expected_delete" ]]
            [[ "${checksum_entries[0]}" == "$expected_checksums" ]]
            while IFS= read -r relative || [[ -n "$relative" ]]; do
              relative="${relative%$'\r'}"
              [[ -z "$relative" || "$relative" == \#* ]] && continue
              if [[ "$relative" == /* || "$relative" =~ (^|/)\.\.(/|$) ]]; then
                echo "::error::Ruta de eliminación no segura: $relative"
                exit 1
              fi
              target="$project_dir/$relative"
              if [[ -d "$target" ]]; then
                echo "::error::La actualización no autoriza borrar directorios."
                exit 1
              fi
              if [[ -f "$target" || -L "$target" ]]; then
                unlink -- "$target"
              fi
            done < <(unzip -p "$archive_path" "${delete_entries[0]}")
            unzip -qo "$archive_path" -d "$project_dir"
            (cd "$project_dir" && sha256sum -c "${checksum_entries[0]}")
            echo "Aplicada y verificada: $archive"
          done

          grep -q '41.0.0-playtest-correction-gb02-r04-candidate-r18' "$project_dir/app/build.gradle.kts"
          grep -q 'GB02-R04-PLAYTEST-R18-v1' "$project_dir/app/src/main/assets/www/graybox-game.js"
          grep -q "$CONTRACT_SHA256" "$project_dir/app/src/main/assets/www/graybox-game.js"
          test "$(find "$project_dir/app/src/main/assets/www/assets/playtest/arte-gb02-r16-r01" -type f -name '*.png' | wc -l)" -eq 102
          ladder_r17="$project_dir/app/src/main/assets/www/assets/playtest/arte-gb02-r16-r01/04_ESTRUCTURAS_CANONICAS/S012-escalera-madera-1x3_5-r17-transparent.png"
          echo "$S012_R17_SHA256  $ladder_r17" | sha256sum -c -
          test ! -e "$project_dir/docs/BUILD_STATUS_R12.json"
          test ! -e "$project_dir/docs/BUILD_STATUS_R13.json"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recuperar locuciones de Azure
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/app/src/main/assets/www/assets/audio
          key: azure-r18-${{ env.R18_SHA256 }}

      - name: Validar catálogo heredado
        working-directory: ${{ env.PROJECT_DIR }}
        run: node tests/azure-catalogue-smoke.mjs

      - name: Generar locuciones con Azure
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/generate-azure-audio.mjs

      - name: Validar sintaxis R18
        working-directory: ${{ env.PROJECT_DIR }}
        run: node --check app/src/main/assets/www/app.js && node --check app/src/main/assets/www/graybox-game.js

      - name: Validar HUD R11 preservado
        working-directory: ${{ env.PROJECT_DIR }}
        run: node tests/hud-hearts-r11-smoke.mjs

      - name: Validar arte funcional y S012 transparente
        working-directory: ${{ env.PROJECT_DIR }}
        run: node tests/r16-functional-art-smoke.mjs

      - name: Validar contrato R04 y correcciones R18
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GB02_EVIDENCE_DIR: docs/evidencias-r18-ci
        run: node tests/gb02-r04-smoke.mjs

      - name: Compilar APK candidata R18
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Generar evidencia de build candidata
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          evidence="$RUNNER_TEMP/R18_BUILD_EVIDENCE.txt"
          test -f "$apk"
          {
            echo 'EREN-GB02-R04-R18-PLAYTEST-CORRECTION-CANDIDATE'
            echo "repository=$GITHUB_REPOSITORY"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "baseline_main=$BASELINE_MAIN_SHA"
            echo 'chain=BASE+R05+R07+R08+R09+R10+R11+R14+R15+R16+R17+R18'
            echo 'preserved_not_applied=R12,R13'
            echo "contract_sha256=$CONTRACT_SHA256"
            echo "r14_sha256=$R14_SHA256"
            echo "r15_sha256=$R15_SHA256"
            echo "r16_sha256=$R16_SHA256"
            echo "r17_sha256=$R17_SHA256"
            echo "r18_sha256=$R18_SHA256"
            echo "s012_r17_sha256=$S012_R17_SHA256"
            echo 'merge_to_main=false'
            echo 'release=false'
            echo 'game_ready=false'
            sha256sum "$apk"
          } > "$evidence"
          cat "$evidence"

      - name: Guardar APK y evidencias candidatas
        uses: actions/upload-artifact@v4
        with:
          name: Eren-GB02-R04-R18-playtest-correction-candidate
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/docs/evidencias-r18-ci/*.json
            ${{ runner.temp }}/R18_BUILD_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
