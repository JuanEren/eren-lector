name: Compilar candidata GB02 R04 R23
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_SPEECH_VOICE: es-ES-ElviraNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar Node para las locuciones
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recuperar locuciones de Azure
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/www/assets/audio
          key: azure-tts-v2-${{ hashFiles('app/src/main/assets/www/app.js', 'scripts/generate-azure-audio.mjs', 'scripts/extract-audio-catalogue.mjs') }}
      - name: Validar catálogo de locuciones en Node
        run: node tests/azure-catalogue-smoke.mjs
      - name: Generar locuciones expresivas con Azure
        if: env.AZURE_SPEECH_KEY != '' && env.AZURE_SPEECH_REGION != ''
        run: node scripts/generate-azure-audio.mjs
      - name: Validar HUD fijo R11 preservado
        run: node tests/hud-hearts-r11-smoke.mjs
      - name: Validar sintaxis del runtime R23
        run: node --check app/src/main/assets/www/app.js && node --check app/src/main/assets/www/graybox-game.js
      - name: Validar actores funcionales heredados de R19
        run: node tests/r16-functional-art-smoke.mjs
      - name: Validar alfa real de la escalera R21
        run: node tests/ladder-alpha-r21-smoke.mjs
      - name: Validar decoración, partículas y checkpoints visuales R22
        run: node tests/r22-decoration-smoke.mjs
      - name: Validar atmósfera, agua, fauna y audio R23
        run: node tests/r23-atmosphere-audio-smoke.mjs
      - name: Validar contrato GB02 R04 y regresiones R23
        run: node tests/gb02-r04-smoke.mjs
      - name: Compilar APK de prueba
        run: gradle assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Eren-GB02-R04-R23-APK-CANDIDATE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
